project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv/**/*",
    "**/backend/.venv/**/*",
    "scratch/**/*",
    "**/scratch/**/*",
    "*_pyrefly_virtual_*",
    "**/_pyrefly_virtual_/**/*",
]
search-path = [
    "backend",
    "backend/.venv/Lib/site-packages",
    ".venv/Lib/site-packages",
]
site-package-path = [
    "backend/.venv/Lib/site-packages",
    ".venv/Lib/site-packages",
]
disable-type-errors-in-ide = true
ignore-errors-in-generated-code = true

[errors]
missing-import = "ignore"
unknown-name = "ignore"
parse-error = "ignore"
