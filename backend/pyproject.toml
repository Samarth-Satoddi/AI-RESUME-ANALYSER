[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-analyzer-backend"
version = "1.0.0"
description = "AI-Powered Resume Analyzer & Job Opportunity Matcher Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "AI Resume Analyzer Team" }
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
